services:
  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object_storage_data:/data
  object-storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - object-storage
    entrypoint: ["/bin/sh", "-c"]
    command: "until mc alias set local http://object-storage:9000 minioadmin minioadmin; do sleep 1; done; mc mb --ignore-existing local/research-files"
    restart: "no"
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: research
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  object_storage_data:
