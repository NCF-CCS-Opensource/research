project_id = "ccs-research-hub-frontend"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/confirm", "http://localhost:3000/auth/confirm"]

[auth.email]
enable_signup = true
enable_confirmations = true

# Enable for real local Clerk sessions after setting CLERK_DOMAIN:
# [auth.third_party.clerk]
# enabled = true
# domain = "env(CLERK_DOMAIN)"

[functions.r2]
enabled = true
verify_jwt = false
entrypoint = "./functions/r2/index.ts"
